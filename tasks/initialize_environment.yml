- name: Gather Ansible facts
  ansible.builtin.setup:
    filter:
      - architecture
      - date_time
      - default_ipv4
      - distribution
      - distribution_major_version
      - fips
      - os_family
      - python_version
      - selinux
      - system
      - user_id

- name: Show OS facts
  ansible.builtin.debug:
    msg:
      - "Date: {{ ansible_facts['date_time'].date }}"
      - "Ansible user: {{ ansible_facts['user_id'] }}"
      - "Distro: {{ ansible_facts['distribution'] }} version {{ ansible_facts['distribution_major_version'] }}"
      - "Python version: {{ ansible_facts['python_version'] }}"
      - "OS family: {{ ansible_facts['os_family'] }}"
      - "System: {{ ansible_facts['system'] }}"
      - "Architecture: {{ ansible_facts['architecture'] }}"
      - "FIPS boolean: {{ ansible_facts['fips'] }}"
      - "SELinux status: {{ ansible_facts['selinux'].status }}"
      - "Ansible default IPV4: {{ ansible_facts['default_ipv4'].address }}, {{ ansible_facts['default_ipv4'].interface }} interface"

