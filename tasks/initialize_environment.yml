- name: Validate base_domain
  ansible.builtin.assert:
    that:
      - base_domain is defined
      - base_domain | trim | length > 0
    fail_msg: >-
      The required variable 'base_domain' is missing or empty.
      Verify Packer variable 'BASE_DOMAIN' is set and passed with:
        ansible-playbook -e "base_domain=${BASE_DOMAIN}"

- name: Validate base_dn
  ansible.builtin.assert:
    that:
      - base_dn is defined
      - base_dn | trim | length > 0
    fail_msg: >-
      Required variable 'base_dn' is missing or empty.
      Verify vars/environment.yml defines 'base_dn'.
      Loaded with:
        ansible-playbook -e "@vars/environment.yml"

