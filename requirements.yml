---
# Collections are explicitly sourced from the official Ansible Galaxy
# https://docs.ansible.com/projects/ansible/latest/collections/index.html
collections:
  # General system utilities, filters, and Jenkins and OpenLDAP integration
  # https://docs.ansible.com/projects/ansible/latest/collections/community/general/index.html#plugins-in-community-general
  - name: community.general
    # version: ">=13.0.0,<13.1.0"
    source: https://galaxy.ansible.com

  # AWS core modules (EC2, VPC/ENI, IAM, S3, RDS, ALB, etc.)
  # Maintained by Red Hat / AWS; included in Ansible core AWS support.
  # https://docs.ansible.com/projects/ansible/latest/collections/amazon/aws/index.html
  - name: amazon.aws
    # version: ">=11.3.0,<12.0.0"
    source: https://galaxy.ansible.com

  # Additional AWS modules (SNS, SQS, EKS, MSK, Config, CodePipeline, Redshift, etc.)
  # Maintained by the Ansible community; requires amazon.aws.
  # https://docs.ansible.com/projects/ansible/latest/collections/community/aws/index.html
  - name: community.aws
    # version: ">=11.0.0,<12.0.0"
    source: https://galaxy.ansible.com

  # File ACL, firewalld, SELinux modules
  # https://docs.ansible.com/projects/ansible/latest/collections/ansible/posix/index.html#plugins-in-ansible-posix
  - name: ansible.posix
    # version: ">=2.2.0"
    source: https://galaxy.ansible.com
