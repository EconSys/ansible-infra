---
- name: Initialize environment
  hosts: local_host
  become: true
  run_once: true
  gather_facts: false

  tasks:
    - name: Get the current caller identity
      amazon.aws.aws_caller_info:
      register: caller_info
      # ensure this runs even in check mode
      check_mode: false

    - name: Validate account ID is present
      ansible.builtin.fail:
        msg: >-
          Could not determine AWS account ID.
          caller_info: {{ caller_info | to_nice_json }}
      when:
        - caller_info.account is not defined

    - name: Gather Ansible facts
      ansible.builtin.setup:
        filter:
          - architecture
          - date_time
          - default_ipv4
          - distribution
          - distribution_major_version
          - fips
          - os_family
          - python_version
          - selinux
          - system
          - user_id

    - name: Show OS facts
      ansible.builtin.debug:
        msg:
          - "Date and time: {{ ansible_facts['date_time'].date }}"
          - "Ansible user: {{ ansible_facts['user_id'] }}"
          - "Distro: {{ ansible_facts['distribution'] }} version: {{ ansible_distribution_major_version }}"
          - "Python version: {{ ansible_facts['python_version'] }}"
          - "OS family: {{ ansible_facts['os_family'] }}"
          - "System: {{ ansible_facts['system'] }}"
          - "Architecture: {{ ansible_facts['architecture'] }}"
          - "FIPS boolean: {{ ansible_facts['fips'] }}"
          - "SELinux status: {{ ansible_facts['selinux'].status }}"
          - "Ansible default IPV4: {{ ansible_facts['default_ipv4'].address }} {{ ansible_facts['default_ipv4'].interface }}"

    # - name: Set normalized build architecture
    #   ansible.builtin.set_fact:
    #     os_arch: >-
    #       {{
    #         {
    #           'x86_64': 'linux_amd64',
    #           'aarch64': 'linux_arm64'
    #         }[ansible_facts['architecture']]
    #       }}

    # - name: Show os_arch variable
    #   ansible.builtin.debug:
    #     var: os_arch

    # https://docs.ansible.com/projects/ansible/latest/collections/amazon/aws/ec2_metadata_facts_module.html
    - name: Gather EC2 metadata facts
      amazon.aws.ec2_metadata_facts:

    - name: Set AWS region
      ansible.builtin.set_fact:
        aws_region: "{{ ansible_ec2_placement_region }}"

    - name: Show aws_region variable
      ansible.builtin.debug:
        var: aws_region

    - name: Set base domain
      ansible.builtin.set_fact:
        base_domain: "{{ lookup('template', 'templates/base_domain.yml.j2') | trim }}"

    - name: Show base_domain variable
      ansible.builtin.debug:
        var: base_domain

    - name: Fail if account ID is not recognized
      ansible.builtin.fail:
        msg: >-
          Unknown AWS account ID: {{ caller_info.account }}.
      when: base_domain == ''
