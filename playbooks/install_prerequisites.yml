---
- name: Install required packages for base AMI
  hosts: local_host
  become: true

  tasks:
    # top-level variable needed for version-specific DNF repositories
    - name: Gather Ansible OS distribution major version
      ansible.builtin.setup:
        filter:
          - distribution_major_version

    - name: Set RHEL major version
      ansible.builtin.set_fact:
        rhel_version: "{{ ansible_facts['distribution_major_version'] }}"

    - name: Show rhel_version variable
      ansible.builtin.debug:
        var: rhel_version

    # TASKS
    - name: Install base packages
      ansible.builtin.import_role:
        name: base_packages
        tasks_from: install_base_packages

    - name: Install AWS CLI v2
      ansible.builtin.import_role:
        name: aws
        tasks_from: install_aws_cli

    - name: Install SSM Agent
      ansible.builtin.import_role:
        name: aws
        tasks_from: install_ssm_agent

    - name: Generate RPM manifest
      ansible.builtin.import_role:
        name: base_packages
        tasks_from: generate_rpm_manifest
