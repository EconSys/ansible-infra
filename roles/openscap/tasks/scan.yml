- name: Gather Ansible OS distribution major version
  ansible.builtin.setup:
    filter:
      - distribution
      - distribution_major_version

- name: Create openscap directory
  ansible.builtin.file:
    path: "{{ openscap_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
    seuser: _default
    serole: _default
    setype: _default
    selevel: _default

- name: Find OpenSCAP RHEL datastream
  ansible.builtin.find:
    paths:
      - /usr/share/xml/scap/ssg/content
    patterns:
      - "{{ openscap_base_rule_set_rhel }}"
    file_type: file
    recurse: false
  register: openscap_datastream_search

- name: Verify that exactly one datastream was found
  ansible.builtin.assert:
    that:
      - openscap_datastream_search.matched == 1
    fail_msg: >-
      Expected exactly one OpenSCAP datastream for {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_major_version'] }},
      but found {{ openscap_datastream_search.matched }}.

- name: Set OpenSCAP datastream path
  ansible.builtin.set_fact:
    openscap_datastream: "{{ openscap_datastream_search.files[0].path }}"

- name: Run OpenSCAP STIG evaluation
  ansible.builtin.command:
    argv:
      - oscap
      - xccdf
      - eval
      - --fetch-remote-resources
      - --profile
      - "{{ openscap_profile_stig }}"
      - --results-arf
      - "{{ openscap_arf_xml }}"
      - "{{ openscap_datastream }}"
  register: openscap_scan
  changed_when: false
  failed_when: openscap_scan.rc not in [0, 2]

- name: Generate OpenSCAP HTML report
  ansible.builtin.shell:
    cmd: >
      oscap xccdf generate report
      {{ openscap_arf_xml | quote }}
      > {{ openscap_report_file | quote }}
  register: openscap_report
  changed_when: true

- name: Parse XML and generate tab-delimited OpenSCAP file
  ansible.builtin.shell:
    cmd: |
      python3 - "{{ openscap_report_html }}" "{{ openscap_results_tsv }}" <<'PY'
      import sys
      import xml.etree.ElementTree as ET

      arf_file = sys.argv[1]
      output_file = sys.argv[2]

      def local_name(tag):
          return tag.rsplit("}", 1)[-1]

      def direct_child_text(element, child_name):
          for child in element:
              if local_name(child.tag) == child_name:
                  return "".join(child.itertext()).strip()
          return ""

      root = ET.parse(arf_file).getroot()

      # Build a lookup of XCCDF rule ID -> rule title.
      rule_titles = {}

      for element in root.iter():
          if local_name(element.tag) == "Rule":
              rule_id = element.attrib.get("id")
              title = direct_child_text(element, "title")

              if rule_id:
                  rule_titles[rule_id] = title

      with open(output_file, "w", encoding="utf-8") as output:
          output.write("idref\ttitle\tresult\n")

          for element in root.iter():
              if local_name(element.tag) != "rule-result":
                  continue

              # In XCCDF, idref is normally an attribute.
              rule_id = element.attrib.get("idref", "")
              result = direct_child_text(element, "result")
              title = rule_titles.get(rule_id, "")

              output.write(
                  f"{rule_id}\t{title}\t{result}\n"
              )
      PY
  changed_when: true
