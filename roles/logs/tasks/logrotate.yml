- name: Ensure logrotate drop-in directory exists
  ansible.builtin.file:
    path: /etc/logrotate.d
    state: directory
    mode: '0755'
    seuser: _default
    serole: _default
    setype: _default
    selevel: _default

- name: Configure syslog logrotate policy
  ansible.builtin.copy:
    src: logrotate/syslog
    dest: /etc/logrotate.d/syslog
    owner: root
    group: root
    mode: "0644"
    seuser: _default
    serole: _default
    setype: _default
    selevel: _default

- name: Validate logrotate configuration
  ansible.builtin.command:
    cmd: logrotate --debug /etc/logrotate.conf
  changed_when: false
