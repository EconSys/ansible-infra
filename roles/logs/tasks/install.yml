- name: Ensure rsyslog installed
  ansible.builtin.dnf:
    name: rsyslog
    state: present
    disable_gpg_check: false

- name: Ensure rsyslog is enabled and running
  ansible.builtin.systemd_service:
    name: rsyslog
    enabled: true
    state: started

- name: Ensure logrotate installed
  ansible.builtin.dnf:
    name: logrotate
    state: present
    disable_gpg_check: false
