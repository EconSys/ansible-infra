# Route selected facilities to dedicated log files.
#
# This supplements the default RHEL rsyslog configuration by creating
# facility-specific logs for operational troubleshooting and compliance
# requirements. The default /var/log/messages log is retained.
kern.*      action(type="omfile" file="/var/log/kern.log")
daemon.*    action(type="omfile" file="/var/log/daemon.log")
syslog.*    action(type="omfile" file="/var/log/syslog")