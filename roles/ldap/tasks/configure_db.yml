# `dn: ""` plus `scope: base` corresponds to `-s base -b ""`
# `sasl_class: external` corresponds to `-Y EXTERNAL`
# `scope:` for searches
#   - base (default)
#   - children - equivalent to a “subtree” scope
#   - onelevel - avoids recursively searching configuration subtrees
#   - subordinate - requires the LDAPv3 subordinate feature extension

- name: Query OpenLDAP configuration context from the root DSE
  ansible.builtin.command:
    cmd: ldapsearch -Q -Y EXTERNAL -H ldapi:/// -LLL -s base -b "" configContext
  register: ldap_config_context_raw
  changed_when: false

- name: Set configuration context DN
  ansible.builtin.set_fact:
    ldap_config_context_dn: "{{ ldap_config_context_raw.stdout_lines | select('match', '^configContext:') | first | regex_replace('^configContext:\\s*', '') }}"

- name: Configure Global and Data configuration context
  community.general.ldap_attrs:
    server_uri: ldapi:///
    sasl_class: external
    dn: "{{ ldap_config_context_dn }}"
    attributes:
      olcAllows: "{{ ldap_olc.allows }}"
      olcDisallows: "{{ ldap_olc.disallows }}"
      olcLogLevel: "{{ ldap_olc.log_levels }}"
      olcPasswordCryptSaltFormat: "{{ ldap_olc.password_crypt_salt_format }}"
    state: exact

- name: Query OpenLDAP database configuration
  ansible.builtin.command:
    cmd: >-
      ldapsearch -Q -Y EXTERNAL -H ldapi:/// -LLL
      -b "{{ ldap_config_context_dn }}" -s one
      "(olcSuffix=*)" dn
  register: ldap_database_dn_raw
  changed_when: false

- name: Set OpenLDAP database configuration DN
  ansible.builtin.set_fact:
    ldap_db_dn: "{{ ldap_database_dn_raw.stdout_lines | select('match', '^dn:') | first | regex_replace('^dn:\\s*', '') }}"

- name: Set OpenLDAP database configuration DN
  ansible.builtin.set_fact:
    ldap_db_dn: "{{ ldap_database_dn.results[0].dn }}"
  changed_when: false

- name: Configure database root DN
  community.general.ldap_attrs:
    server_uri: ldapi:///
    sasl_class: external
    dn: "{{ ldap_db_dn }}"
    attributes:
      olcSuffix: "{{ base_dn }}"
    state: exact

- name: Query OpenLDAP frontend database configuration
  ansible.builtin.command:
    cmd: >-
      ldapsearch -Q -Y EXTERNAL -H ldapi:/// -LLL
      -b "{{ ldap_config_context_dn }}"
      olcPasswordHash dn
  register: ldap_frontend_database_raw
  changed_when: false

- name: Set OpenLDAP frontend database configuration DN
  ansible.builtin.set_fact:
    ldap_frontend_db_dn: "{{ ldap_frontend_database_raw.stdout_lines | select('match', '^dn:.*frontend') | first | regex_replace('^dn:\\s*', '') }}"

- name: Configure local crypt(3) as the default password hash scheme
  community.general.ldap_attrs:
    server_uri: ldapi:///
    sasl_class: external
    dn: "{{ ldap_frontend_db_dn }}"
    attributes:
      olcPasswordHash:
        - "{CRYPT}"
    state: exact

- name: Generate salted SHA-512 crypt password hash
  ansible.builtin.command:
    argv:
      - slappasswd
      - -h
      - "{CRYPT}"
      - -c
      - "{{ ldap_olc.password_crypt_salt_format }}"
  args:
    stdin: "{{ vault_ldap_bind_pw }}"
    stdin_add_newline: false
  register: ldap_salted_password
  changed_when: false
  no_log: true

- name: Initialize root DN and password for directory bootstrapping
  community.general.ldap_attrs:
    server_uri: ldapi:///
    sasl_class: external
    dn: "{{ ldap_db_dn }}"
    attributes:
      olcRootDN: "{{ bind_dn }}"
      olcRootPW: "{{ ldap_salted_password.stdout }}"
    state: exact
  no_log: true
