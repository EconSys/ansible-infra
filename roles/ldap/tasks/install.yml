- name: Install required packages
  ansible.builtin.dnf:
    name:
      - openldap
      - openldap-servers
      - openldap-clients
      - cyrus-sasl-lib
    state: present
    validate_certs: true
    disable_gpg_check: false

- name: Enable slapd
  ansible.builtin.systemd_service:
    name: slapd.service
    enabled: true
