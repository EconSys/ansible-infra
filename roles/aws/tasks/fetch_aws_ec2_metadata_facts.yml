# https://docs.ansible.com/projects/ansible/latest/collections/amazon/aws/ec2_metadata_facts_module.html
- name: Gather EC2 metadata facts
  amazon.aws.ec2_metadata_facts:

- name: Set AWS region
  ansible.builtin.set_fact:
    aws_region: "{{ ansible_ec2_placement_region }}"

- name: Show aws_region variable
  ansible.builtin.debug:
    var: aws_region

- name: Set AWS Instance ID
  ansible.builtin.set_fact:
    aws_instance_id: "{{ ansible_ec2_instance_identity_document_instanceid }}"

- name: Show aws_instance_id variable
  ansible.builtin.debug:
    var: aws_instance_id

# # https://docs.ansible.com/projects/ansible/latest/collections/amazon/aws/aws_caller_info_module.html
- name: Get the current caller identity
  amazon.aws.aws_caller_info:
  register: caller_info
  # ensure this runs even in check mode
  check_mode: false

- name: Validate account ID is present
  ansible.builtin.fail:
    msg: >-
      Could not determine AWS account ID.
      caller_info: {{ caller_info | to_nice_json }}
  when:
    - caller_info.account is not defined

- name: Set current AWS account id
  ansible.builtin.set_fact:
    aws_account_id_current: "{{ caller_info.account }}"

- name: Show aws_account_id_current variable
  ansible.builtin.debug:
    var: aws_account_id_current
