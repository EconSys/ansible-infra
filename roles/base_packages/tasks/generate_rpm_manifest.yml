---
- name: Ensure package manifest directory exists, create if necessary
  ansible.builtin.file:
    path: "{{ base_packages_manifest_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Export full RPM database for documentation and compliance audit
  ansible.builtin.command:
    argv:
      - rpm
      - -qa
      - --last
  register: base_packages_rpm_full_output
  changed_when: false

- name: Save RPM manifest to file
  ansible.builtin.copy:
    content: |
      # RHEL Packer AMI - Installed Packages Manifest
      # Generated: {{ ansible_date_time.iso8601 }}
      # Hostname: {{ ansible_hostname }}
      # OS: {{ ansible_distribution }} {{ ansible_distribution_version }}
      # ========================================================================
      # Complete RPM database dump (all packages including dependencies)
      # Format: package-version-release.arch  install_timestamp
      # ========================================================================

      {{ base_packages_rpm_full_output.stdout }}
    dest: "{{ base_packages_manifest_file }}"
    owner: root
    group: root
    mode: "0644"
