# Managed by the Ansible ssh role.
#
# Cloud-init owns SSH server host-key lifecycle for instances launched from
# the AMI. It removes any image-baked host keys according to ssh_deletekeys
# and generates the types listed below according to ssh_genkeytypes.
#
# Do not generate, regenerate, or remove /etc/ssh/ssh_host_* keys in the AMI
# cleanup phase. The image must not contain instance-specific host keys.
#
# This list excludes Ed25519 for compatibility with the platform crypto policy
# when FIPS mode is enabled.
# - cloud-init SSH module documentation:
#   https://docs.cloud-init.io/en/latest/reference/modules.html#ssh
#
# Generate only SSH host-key types permitted by the platform crypto policy.
ssh_genkeytypes: ['rsa', 'ecdsa']
