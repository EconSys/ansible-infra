---
## SSH daemon hardening config file ownership and permissions per STIG
- name: Validate SSH hardening configuration ownership and permissions
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config.d/60-hardening.conf
  register: ssh_hardening_config

- name: Validate RHEL-09-255105 - SSH configuration group ownership
  ansible.builtin.assert:
    that:
      - ssh_hardening_config.stat.gr_name == "root"
    fail_msg: >-
      RHEL-09-255105 failed: SSH hardening configuration group is
      "{{ ssh_hardening_config.stat.gr_name }}".
    success_msg: >-
      RHEL-09-255105: SSH hardening configuration group=root

- name: Validate RHEL-09-255110 - SSH configuration ownership
  ansible.builtin.assert:
    that:
      - ssh_hardening_config.stat.pw_name == "root"
    fail_msg: >-
      RHEL-09-255110 failed: SSH hardening configuration owner is
      "{{ ssh_hardening_config.stat.pw_name }}".
    success_msg: >-
      RHEL-09-255110: SSH hardening configuration owner=root

- name: Validate RHEL-09-255115 - SSH configuration permissions
  ansible.builtin.assert:
    that:
      - ssh_hardening_config.stat.mode == "0600"
    fail_msg: >-
      RHEL-09-255115 failed: SSH hardening configuration mode is
      "{{ ssh_hardening_config.stat.mode }}".
    success_msg: >-
      RHEL-09-255115: SSH hardening configuration mode=0600

## SSH daemon STIG security hardening configurations
- name: Get current SSH daemon configuration
  ansible.builtin.command:
    cmd: sshd -T
  register: ssh_current_config
  changed_when: false

- name: Parse SSH daemon configuration
  ansible.builtin.set_fact:
    ssh_settings: >-
      {{ dict(ssh_current_config.stdout_lines | map('split', ' ', 1)) }}

- name: Validate RHEL-09-255045 - PermitRootLogin
  ansible.builtin.assert:
    that:
      - ssh_settings.permitrootlogin == "no"
    fail_msg: >-
      RHEL-09-255045 failed: PermitRootLogin is
      "{{ ssh_settings.permitrootlogin }}"; expected "no".
    success_msg: >-
      RHEL-09-255045: PermitRootLogin={{ ssh_settings.permitrootlogin }}
    quiet: true

