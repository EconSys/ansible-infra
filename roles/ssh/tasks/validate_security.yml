    success_msg: >-
      AuthorizedKeysCommand={{ ssh_settings.authorizedkeyscommand }}
    quiet: true

- name: Validate AuthorizedKeysFile
  ansible.builtin.assert:
    that:
      - ssh_settings.authorizedkeysfile == "%h/.ssh/authorized_keys"
    fail_msg: >-
      AuthorizedKeysFile is "{{ ssh_settings.authorizedkeysfile }}";
      expected "%h/.ssh/authorized_keys".
    success_msg: >-
      AuthorizedKeysFile={{ ssh_settings.authorizedkeysfile }}
    quiet: true

- name: Validate HostKey
  ansible.builtin.assert:
    that:
      - ssh_host_keys_settings.hostkey == ssh_host_keys
    fail_msg: >-
      HostKey is "{{ ssh_host_keys_settings.hostkey }}";
      expected ssh_host_keys.
    success_msg: >-
      HostKey={{ ssh_host_keys_settings.hostkey }}
    quiet: true
