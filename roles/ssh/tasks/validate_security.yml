    fail_msg: >-
      MaxStartups is "{{ ssh_settings.maxstartups }}"; expected
      "{{ ssh_max_startups }}".
    success_msg: >-
      MaxStartups={{ ssh_settings.maxstartups }}
    quiet: true

- name: Validate AllowGroups
  ansible.builtin.assert:
    that:
      - ssh_allow_groups_settings == ssh_allow_groups
    fail_msg: >-
      AllowGroups is "{{ ssh_allow_groups_settings }}"; expected
      "{{ ssh_allow_groups }}".
    success_msg: >-
