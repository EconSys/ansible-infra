---
# SSH daemon security hardening configurations
- name: Get current SSH daemon configuration
  ansible.builtin.command:
    cmd: sshd -T
  register: ssh_current_config
  changed_when: false

- name: Parse SSH daemon scalar configuration
  ansible.builtin.set_fact:
    ssh_settings: >-
      {{ dict(ssh_current_config.stdout_lines | map('split', ' ', 1)) }}

- name: Parse SSH AllowGroups
  ansible.builtin.set_fact:
    ssh_allow_groups_settings: >-
      {{
        ssh_current_config.stdout_lines
        | select('match', '^allowgroups ')
        | map('regex_replace', '^allowgroups ', '')
        | list
      }}

- name: Parse SSH HostKey
  ansible.builtin.set_fact:
    ssh_host_keys_settings: >-
      {{
        ssh_current_config.stdout_lines
        | select('match', '^hostkey ')
        | map('regex_replace', '^hostkey ', '')
        | list
      }}

- name: Validate PasswordAuthentication
  ansible.builtin.assert:
    that:
      - ssh_settings.passwordauthentication == "no"
    fail_msg: >-
      PasswordAuthentication is "{{ ssh_settings.passwordauthentication }}";
      expected "no".
    success_msg: >-
      PasswordAuthentication={{ ssh_settings.passwordauthentication }}
    quiet: true

- name: Validate MaxAuthTries
  ansible.builtin.assert:
    that:
      - ssh_settings.maxauthtries == (ssh_max_auth_tries | string)
    fail_msg: >-
      MaxAuthTries is "{{ ssh_settings.maxauthtries }}"; expected
      "{{ ssh_max_auth_tries }}".
    success_msg: >-
      MaxAuthTries={{ ssh_settings.maxauthtries }}
    quiet: true

- name: Validate LoginGraceTime
  ansible.builtin.assert:
    that:
