- name: Validate AuthorizedKeysCommand
  ansible.builtin.assert:
    that:
      - ssh_settings.authorizedkeyscommand == ssh_authorized_keys_command
    fail_msg: >-
      AuthorizedKeysCommand is "{{ ssh_settings.authorizedkeyscommand }}";
