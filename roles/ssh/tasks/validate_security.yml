- name: Validate AllowGroups
  ansible.builtin.assert:
    that:
      - ssh_allow_groups_runtime == ssh_allow_groups
    fail_msg: >-
      AllowGroups is "{{ ssh_allow_groups_runtime }}"; expected
      "{{ ssh_allow_groups }}".
    success_msg: >-
