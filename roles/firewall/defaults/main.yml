firewall_default_zone: "drop"
firewall_loopback_zone: "trusted"

# Retain fragmentation-needed when IPv4 traffic is in scope. It is ICMPv4
# "Destination Unreachable: Fragmentation Needed", used by IPv4 Path MTU
# Discovery (PMTUD). Blocking it can cause MTU black holes: small packets
# succeed while larger TCP transfers stall or fail, especially across VPNs,
# tunnels, or reduced-MTU paths.
#
# Retain packet-too-big when IPv6 is enabled or may be enabled. It is ICMPv6
# Packet Too Big, required by IPv6 PMTUD because IPv6 routers do not fragment
# forwarded packets. Do not remove it solely because the host has no current
# IPv6 application listener; outbound IPv6, dual-stack dependencies, and
# future IPv6 enablement can still require it.
#
# If IPv6 is explicitly disabled at the kernel/network level and remains out
# of scope for this AMI, packet-too-big is unnecessary. Reassess before
# enabling IPv6, VPN/tunnel networking, or dual-stack services.
firewall_default_zone_icmp_allowed_types:
  - fragmentation-needed
  - packet-too-big
