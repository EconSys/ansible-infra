---
# IPv4 forwarding is NOT a global baseline setting;
# it's overriding baseline hardening.
# Only import this task from a role that requires packet forwarding.
#
# Example in roles/openvpn/tasks/main.yml:
# - name: Configure IPv4 forwarding for OpenVPN
#   ansible.builtin.import_role:
#     name: sysctl
#     tasks_from: configure_ip_forwarding.yml

- name: Enable IPv4 forwarding for router workload
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    state: present
    sysctl_file: "{{ sysctl_conf_ip_forwarding }}"
    sysctl_set: true
    reload: false
  notify: Reload sysctl configuration

- name: Enable IPv4 forwarding on all interfaces for router workload
  ansible.posix.sysctl:
    name: net.ipv4.conf.all.forwarding
    value: '1'
    state: present
    sysctl_file: "{{ sysctl_conf_ip_forwarding }}"
    sysctl_set: true
    reload: false
  notify: Reload sysctl

- name: Define expected IPv4 forwarding settings
  ansible.builtin.set_fact:
    sysctl_ip_forwarding:
      - name: net.ipv4.ip_forward
        value: "1"

      - name: net.ipv4.conf.all.forwarding
        value: "1"
  changed_when: false

- name: Read IPv4 forwarding settings for router workload
  ansible.builtin.command:
    argv:
      - /sbin/sysctl
      - -n
      - "{{ sysctl_forwarding.name }}"
  loop: "{{ sysctl_ip_forwarding }}"
  loop_control:
    loop_var: sysctl_forwarding
    label: "{{ sysctl_forwarding.name }}"
  register: sysctl_forwarding_actual
  changed_when: false
  failed_when: false

- name: Assert IPv4 forwarding settings are enabled
  ansible.builtin.assert:
    that:
      - sysctl_forwarding_actual.rc == 0
      - >-
        (sysctl_forwarding_actual.stdout | trim)
        == sysctl_forwarding_actual.sysctl_forwarding.value
    fail_msg: >-
      IPv4 forwarding validation failed for
      {{ sysctl_forwarding_actual.sysctl_forwarding.name }}.

      Expected: {{ sysctl_forwarding_actual.sysctl_forwarding.value }}
      Actual: {{ sysctl_forwarding_actual.stdout | default('<unavailable>') | trim }}

      Return code: {{ sysctl_forwarding_actual.rc }}

      stderr:
      {{ sysctl_forwarding_actual.stderr | default('') | trim }}
    quiet: true
  loop: "{{ sysctl_forwarding_actual.results }}"
  loop_control:
    loop_var: sysctl_forwarding_actual
    label: "{{ sysctl_forwarding_actual.sysctl_forwarding.name }}"
